name: Engine, profile or feature request
description: Propose a declared operation, engine integration or usability improvement.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the research integration you want to check. Keep examples synthetic and omit patient data, private paths and raw worker logs.
  - type: textarea
    id: need
    attributes:
      label: Integration need
      description: What task is difficult now? State the intended engine/version, operation/settings and available source/observation boundary. For interface-only requests, describe the task directly.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Proposed behaviour and scope
      description: What should satisfy, violate or remain indeterminate/unavailable? Identify inputs the proposed profile must decline; for an interface change, describe the expected workflow.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Independent evidence or synthetic example
      description: If available, provide an analytical expectation, primary source, or small synthetic control and violation that could validate the proposal.
