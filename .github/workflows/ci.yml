name: Core verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify release manifest
        run: python -B scripts/check_release.py
      - name: Verify sampling freeze and immutable historical archive
        run: python -B scripts/verify_sampling_freeze.py
      - name: Verify both immutable native development archives
        run: python -B scripts/verify_native_freeze.py --archives-only
      - name: Verify current prospective implementation and protocol freeze
        run: python -B scripts/verify_prospective_freeze.py
      - name: Install pinned core and independent image reader
        run: python -m pip install --disable-pip-version-check -r software/requirements-core.txt SimpleITK==2.5.3 pytest==9.0.2
      - name: Test release tools
        run: python -B -m unittest discover -s scripts/tests -v
      - name: Test sampling freeze verification
        run: python -B -m pytest -q -p no:cacheprovider scripts/tests/test_sampling_freeze.py
      - name: Test public clinical source acquisition using synthetic fixtures
        run: python -B -m pytest -q -p no:cacheprovider tests/test_msd_validation_sources.py
      - name: Test physical and feature contracts
        working-directory: software
        run: python -B -m unittest discover -s tests -v
      - name: Run real-input demo without extractors
        run: python -B scripts/demo.py
      - name: Run generated sampling and checkpoint demo
        run: python -B scripts/demo_sampling.py --output outputs/sampling_demo
      - name: Replay retained sampling summaries byte for byte
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          for cohort in ('reserved', 'clinical'):
              source = Path('results') / ('sampling_' + cohort)
              output = Path('reproduced') / ('sampling_' + cohort)
              subprocess.run([sys.executable, '-B', 'scripts/summarize_sampling_study.py',
                              '--input', str(source), '--output', str(output)], check=True)
              expected = source / 'summary'
              names = sorted(path.name for path in expected.iterdir() if path.is_file())
              assert len(names) == 12, 'Unexpected archived summary file count'
              assert names == sorted(path.name for path in output.iterdir() if path.is_file())
              for name in names:
                  assert (expected / name).read_bytes() == (output / name).read_bytes(), (cohort, name)
              print(cohort + ': 12/12 summary files byte-identical')
      - name: Restore hash-verified study records
        run: python -B scripts/restore_records.py
      - name: Reproduce archived decisions in a fresh directory
        run: python -B reproduce_archived.py --output "${{ runner.temp }}/radaccord-reproduced"
      - name: Recheck release and restored record integrity
        run: python -B scripts/check_release.py
