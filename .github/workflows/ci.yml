name: Core verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify release manifest
        run: python -B scripts/check_release.py
      - name: Install pinned core and independent image reader
        run: python -m pip install --disable-pip-version-check -r software/requirements-core.txt SimpleITK==2.5.3
      - name: Test release tools
        run: python -B -m unittest discover -s scripts/tests -v
      - name: Test physical and feature contracts
        working-directory: software
        run: python -B -m unittest discover -s tests -v
      - name: Run real-input demo without extractors
        run: python -B scripts/demo.py
      - name: Restore hash-verified study records
        run: python -B scripts/restore_records.py
      - name: Reproduce archived decisions in a fresh directory
        run: python -B reproduce_archived.py --output "${{ runner.temp }}/radaccord-reproduced"
      - name: Recheck release and restored record integrity
        run: python -B scripts/check_release.py
