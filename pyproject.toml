[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radaccord"
version = "1.3.0rc1"
description = "Physical consistency checks for declared radiomics processing operations"
authors = [{name = "Clemente García-Hidalgo"}]
readme = "docs/INSTALL.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.23.5,<2.3", "nibabel==5.3.3"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
pyradiomics = ["numpy==1.23.5", "SimpleITK==2.2.1", "pyradiomics==3.0.1"]
mirp = ["numpy==2.2.6", "scipy==1.15.3", "pandas==2.3.3", "scikit-image==0.26.0", "SimpleITK==2.5.3", "mirp==2.5.0"]
oracle = ["scipy>=1.10,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
radaccord = "radaccord.cli:main"

[project.urls]
Repository = "https://github.com/torkitor/RadAccord"
Issues = "https://github.com/torkitor/RadAccord/issues"

[tool.setuptools]
packages = ["radaccord", "radaccord._frozen"]
py-modules = ["radaccord_sampling"]
package-dir = { "radaccord" = "radaccord", "radaccord._frozen" = "software" }
include-package-data = false
